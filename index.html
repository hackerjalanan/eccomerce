
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedaii Fidaa — List Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #f6c9d6;
    --pink-bg-2: #f2b9c9;
    --cream: #fffaf6;
    --maroon: #6b2338;
    --maroon-soft: #8a3a4f;
    --gold: #c99a4a;
    --line: rgba(107,35,56,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 90% 12%, rgba(255,255,255,0.25), transparent 35%),
      linear-gradient(180deg, var(--pink-bg) 0%, var(--pink-bg-2) 100%);
    font-family:'Nunito', sans-serif;
    color: var(--maroon);
    min-height:100vh;
    padding-bottom: 120px;
  }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 28px 18px 0; }

  /* Header */
  header{ text-align:center; padding: 6px 4px 22px; }
  .eyebrow-script{
    font-family:'Caveat', cursive;
    font-size: 1.5rem;
    color: var(--maroon-soft);
    margin: 0 0 2px;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.05;
    color: var(--maroon);
  }
  .subtitle{
    font-family:'Caveat', cursive;
    font-size: 1.7rem;
    color: var(--maroon-soft);
    margin: 4px 0 0;
  }
  .header-rule{
    width: 64px; height: 3px; background: var(--gold);
    margin: 16px auto 0; border-radius: 2px;
  }

  /* Menu card */
  .menu-list{ display:flex; flex-direction:column; gap: 20px; margin-top: 26px; }
  .item-card{
    background: var(--cream);
    border-radius: 22px;
    padding: 16px;
    display:flex;
    gap: 14px;
    box-shadow: 0 10px 24px -14px rgba(107,35,56,0.35);
    border: 1px solid rgba(107,35,56,0.06);
  }
  .item-photo{
    flex: 0 0 92px;
    width: 92px; height: 92px;
    border-radius: 16px;
    overflow:hidden;
    background: var(--pink-bg);
  }
  .item-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .item-body{ flex:1; min-width:0; }
  .item-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.18rem;
    margin: 0 0 8px;
    line-height:1.2;
  }

  .variant-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 0;
    border-top: 1px dashed var(--line);
  }
  .variant-row:first-of-type{ border-top:none; }
  .variant-label{ font-size: 0.92rem; font-weight:700; }
  .variant-price{ font-size: 0.8rem; color: var(--maroon-soft); font-weight:600; }

  .stepper{
    display:flex; align-items:center; gap:8px;
  }
  .stepper button{
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1px solid var(--maroon);
    background: transparent;
    color: var(--maroon);
    font-size: 1rem;
    font-weight:800;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .12s ease;
  }
  .stepper button:active{ transform: scale(0.9); }
  .stepper button.add{ background: var(--maroon); color: var(--cream); }
  .stepper .qty{
    min-width: 16px; text-align:center; font-weight:800; font-size: 0.95rem;
  }

  /* Sticky cart bar */
  .cartbar{
    position: fixed; left: 0; right: 0; bottom: 0;
    display:flex; justify-content:center;
    padding: 14px;
    pointer-events:none;
  }
  .cartbar-inner{
    pointer-events:auto;
    width:100%; max-width: 480px;
    background: var(--maroon);
    color: var(--cream);
    border-radius: 18px;
    padding: 14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.4);
    transform: translateY(120%);
    opacity:0;
    transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
  }
  .cartbar-inner.show{ transform: translateY(0); opacity:1; }
  .cart-info{ display:flex; flex-direction:column; gap:2px; }
  .cart-count{ font-size:0.75rem; opacity:0.85; }
  .cart-total{ font-family:'Fraunces', serif; font-size:1.15rem; font-weight:700; }
  .cart-btn{
    background: var(--gold);
    color: var(--maroon);
    border:none;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size: 0.95rem;
    padding: 11px 18px;
    border-radius: 12px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .cart-btn:active{ transform: scale(0.97); }

  footer.note{
    max-width: 480px; margin: 34px auto 0; padding: 0 18px 20px;
    text-align:center; font-size: 0.8rem; color: var(--maroon-soft); opacity:0.75;
  }

  @media (prefers-reduced-motion: reduce){
    .cartbar-inner{ transition:none; }
    .stepper button{ transition:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow-script">list menu</p>
    <h1 class="title">KEDAII FIDAA</h1>
    <p class="subtitle">pesan favoritmu, langsung ke WhatsApp ♡</p>
    <div class="header-rule"></div>
  </header>

  <div class="menu-list" id="menuList"></div>
</div>

<div class="cartbar">
  <div class="cartbar-inner" id="cartbar">
    <div class="cart-info">
      <span class="cart-count" id="cartCount">0 item</span>
      <span class="cart-total" id="cartTotal">Rp 0</span>
    </div>
    <button class="cart-btn" id="orderBtn">Pesan via WhatsApp</button>
  </div>
</div>

<footer class="note">Harga dapat berubah sewaktu-waktu. Konfirmasi akhir lewat chat WhatsApp.</footer>

// ==== GANTI NOMOR WHATSAPP TOKO DI SINI (format: kode negara tanpa +, mis. 62xxxxxxxxxx) ====
const WHATSAPP_NUMBER = "6281234567890";

const MENU = [
  {
    id: "mie",
    name: "Mie Jebew",
    img: IMG.mie,
    variants: [
      { key: "normal", label: "Normal", price: 10000 },
      { key: "sedang", label: "Sedang", price: 15000 },
    ]
  },
  {
    id: "ceker",
    name: "Ceker Mercon Daun Jeruk",
    img: IMG.ceker,
    variants: [
      { key: "normal", label: "Normal", price: 10000 },
      { key: "sedang", label: "Sedang", price: 15000 },
      { key: "tanpatulang", label: "Tanpa Tulang", price: 18000 },
    ]
  },
  {
    id: "es",
    name: "Es Alpukat Kocok",
    img: IMG.es,
    variants: [
      { key: "normal", label: "Normal", price: 10000 },
      { key: "spesial", label: "Spesial", price: 15000 },
    ]
  },
  {
    id: "pisang",
    name: "Pisang Ijo",
    img: IMG.pisang,
    variants: [
      { key: "normal", label: "Normal", price: 15000 },
      { key: "spesial", label: "Spesial", price: 18000 },
    ]
  },
];

const cart = {}; // key: `${itemId}__${variantKey}` -> qty

function fmtRupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

function keyFor(itemId, variantKey){ return itemId + "__" + variantKey; }

function renderMenu(){
  const list = document.getElementById("menuList");
  list.innerHTML = "";
  MENU.forEach(item => {
    const card = document.createElement("div");
    card.className = "item-card";

    const photo = document.createElement("div");
    photo.className = "item-photo";
    const img = document.createElement("img");
    img.src = item.img;
    img.alt = item.name;
    photo.appendChild(img);

    const body = document.createElement("div");
    body.className = "item-body";

    const name = document.createElement("p");
    name.className = "item-name";
    name.textContent = item.name;
    body.appendChild(name);

    item.variants.forEach(v => {
      const row = document.createElement("div");
      row.className = "variant-row";

      const left = document.createElement("div");
      const label = document.createElement("div");
      label.className = "variant-label";
      label.textContent = v.label;
      const price = document.createElement("div");
      price.className = "variant-price";
      price.textContent = "porsi " + fmtRupiah(v.price);
      left.appendChild(label);
      left.appendChild(price);

      const stepper = document.createElement("div");
      stepper.className = "stepper";

      const minusBtn = document.createElement("button");
      minusBtn.textContent = "–";
      const qtySpan = document.createElement("span");
      qtySpan.className = "qty";
      qtySpan.textContent = "0";
      const addBtn = document.createElement("button");
      addBtn.className = "add";
      addBtn.textContent = "+";

      const k = keyFor(item.id, v.key);

      function refreshQty(){
        const q = cart[k] || 0;
        qtySpan.textContent = q;
        minusBtn.style.visibility = q > 0 ? "visible" : "hidden";
        qtySpan.style.visibility = q > 0 ? "visible" : "hidden";
      }
      minusBtn.style.visibility = "hidden";
      qtySpan.style.visibility = "hidden";

      addBtn.addEventListener("click", () => {
        cart[k] = (cart[k] || 0) + 1;
        refreshQty();
        updateCartBar();
      });
      minusBtn.addEventListener("click", () => {
        cart[k] = Math.max(0, (cart[k] || 0) - 1);
        if(cart[k] === 0) delete cart[k];
        refreshQty();
        updateCartBar();
      });

      stepper.appendChild(minusBtn);
      stepper.appendChild(qtySpan);
      stepper.appendChild(addBtn);

      row.appendChild(left);
      row.appendChild(stepper);
      body.appendChild(row);
    });

    card.appendChild(photo);
    card.appendChild(body);
    list.appendChild(card);
  });
}

function findVariant(itemId, variantKey){
  const item = MENU.find(m => m.id === itemId);
  const v = item.variants.find(v => v.key === variantKey);
  return { item, variant: v };
}

function updateCartBar(){
  const bar = document.getElementById("cartbar");
  const countEl = document.getElementById("cartCount");
  const totalEl = document.getElementById("cartTotal");

  let totalQty = 0;
  let totalPrice = 0;
  Object.entries(cart).forEach(([k, qty]) => {
    const [itemId, variantKey] = k.split("__");
    const { variant } = findVariant(itemId, variantKey);
    totalQty += qty;
    totalPrice += qty * variant.price;
  });

  if(totalQty > 0){
    countEl.textContent = totalQty + " item";
    totalEl.textContent = fmtRupiah(totalPrice);
    bar.classList.add("show");
  } else {
    bar.classList.remove("show");
  }
}

function buildWhatsAppMessage(){
  let lines = ["Halo Kedaii Fidaa, saya mau pesan:", ""];
  let total = 0;
  Object.entries(cart).forEach(([k, qty]) => {
    const [itemId, variantKey] = k.split("__");
    const { item, variant } = findVariant(itemId, variantKey);
    const subtotal = qty * variant.price;
    total += subtotal;
    lines.push(`- ${item.name} (${variant.label}) x${qty} = ${fmtRupiah(subtotal)}`);
  });
  lines.push("");
  lines.push(`Total: ${fmtRupiah(total)}`);
  lines.push("");
  lines.push("Mohon info untuk konfirmasi pesanan ini ya, terima kasih 🙏");
  return lines.join("\n");
}

document.getElementById("orderBtn").addEventListener("click", () => {
  if(Object.keys(cart).length === 0) return;
  const msg = buildWhatsAppMessage();
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
});

renderMenu();
</script>
